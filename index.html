<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Castle Attack - One Lane (Stick Enemies)</title>
<style>
  html,body{margin:0;height:100%;background:#0f1116;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,Roboto}
  canvas{display:block;width:100vw;height:100vh;touch-action:manipulation;-webkit-user-select:none;user-select:none}
  .hud{
    position:fixed;left:10px;top:10px;z-index:5;color:#e8ecff;
    background:rgba(0,0,0,.35);padding:10px 12px;border-radius:10px;
    backdrop-filter: blur(6px);
    font-size:14px;line-height:1.35;min-width:260px;
    padding-top: calc(10px + env(safe-area-inset-top));
    padding-left: calc(12px + env(safe-area-inset-left));
  }
  .hint{opacity:.85;font-size:12px;margin-top:6px}
  .btn{
    margin-top:8px;display:inline-block;background:#2a63ff;color:#fff;
    padding:6px 10px;border-radius:9px;font-weight:800;font-size:13px;
    user-select:none
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div><b>Wave:</b> <span id="wave">1</span></div>
  <div><b>Crowns:</b> <span id="crowns">0</span></div>
  <div><b>Archers Alive:</b> <span id="alive">3</span>/3</div>
  <div><b>Towers:</b> A <span id="ta">100</span>% &nbsp; B <span id="tb">100</span>% &nbsp; C <span id="tc">100</span>%</div>
  <div class="hint">
    Tap/click to aim. All living archers shoot <b>at once</b> with an arc.<br/>
    Aim <b>above</b> enemies to hit ones farther back. Enemies stop at the front tower to attack it.
  </div>
  <div class="btn" id="restart">Restart</div>
</div>

<script>
(() => {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d", { alpha:false });

  const UI = {
    wave: document.getElementById("wave"),
    crowns: document.getElementById("crowns"),
    alive: document.getElementById("alive"),
    ta: document.getElementById("ta"),
    tb: document.getElementById("tb"),
    tc: document.getElementById("tc"),
    restart: document.getElementById("restart"),
  };

  // ===== Helpers =====
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const dist2=(ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;};
  const rand=(a,b)=>a+Math.random()*(b-a);

  function resize(){
    const dpr = Math.max(1, Math.min(2, window.devicePixelRatio||1));
    canvas.width = Math.floor(innerWidth*dpr);
    canvas.height = Math.floor(innerHeight*dpr);
    canvas.style.width = innerWidth+"px";
    canvas.style.height = innerHeight+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  addEventListener("resize", resize, {passive:true});
  resize();

  // ===== Enemy Types (still used for stats) =====
  const ENEMY = {
    scout:  { name:"Scout",  hpMul:0.70, spdMul:1.45, dmgMul:0.90, r:14 },
    soldier:{ name:"Soldier",hpMul:1.00, spdMul:1.00, dmgMul:1.00, r:16 },
    brute:  { name:"Brute",  hpMul:1.90, spdMul:0.72, dmgMul:1.25, r:18 },
    shield: { name:"Shield", hpMul:1.20, spdMul:0.90, dmgMul:1.05, r:17, block:0.35, dr:0.70 }
  };

  let NEXT_ID = 1;

  const G = {
    t: 0,
    wave: 1,
    crowns: 0,

    groundY: 0,
    laneY: 0,

    aimX: 0,
    aimY: 0,
    aimActive: false,

    enemies: [],
    arrows: [],
    particles: [],

    // volley crowns: count arrows that hit *anything*
    volleyActive: false,
    volleyHits: [false,false,false],
    volleyResolveT: 0,

    enemiesToSpawn: 0,
    spawnedThisWave: 0,
    nextSpawn: 0,
    waveClearT: 0,

    towers: [
      { id:"A", hp:100, maxH:245, w:64, x:0, baseY:0, archers:[] },
      { id:"B", hp:100, maxH:225, w:64, x:0, baseY:0, archers:[] },
      { id:"C", hp:100, maxH:210, w:64, x:0, baseY:0, archers:[] },
    ],
    archers: [] // 1 per tower
  };

  function layout(){
    const W = innerWidth, H = innerHeight;
    G.groundY = Math.floor(H*0.82);
    G.laneY = G.groundY;

    // towers in a row (front -> back)
    G.towers[0].x = Math.floor(W*0.18);
    G.towers[1].x = Math.floor(W*0.28);
    G.towers[2].x = Math.floor(W*0.38);

    for(const t of G.towers){
      t.baseY = G.groundY;
      t.w = Math.max(56, Math.floor(W*0.05));
    }

    if(!G.aimActive){
      // default aim slightly above ground, mid-right
      G.aimX = Math.floor(W*0.70);
      G.aimY = Math.floor(G.groundY - H*0.20);
    }
  }

  function towerHeight(t){ return Math.max(0, t.maxH*(t.hp/100)); }

  function archerPos(archer){
    const t = G.towers[archer.towerIndex];
    const h = towerHeight(t);
    return { x: t.x, y: (t.baseY - h) - 12 };
  }

  function aliveArchers(){ return G.archers.reduce((n,a)=>n+(a.alive?1:0),0); }

  function frontAliveTower(){
    // smallest x among towers with hp>0
    let best = null;
    for(const t of G.towers){
      if(t.hp<=0) continue;
      if(!best || t.x < best.x) best = t;
    }
    return best;
  }

  function chooseTypeForWave(w){
    const r = Math.random();
    if(w<3) return (r<0.30) ? "scout" : "soldier";
    if(w<6){
      if(r<0.25) return "scout";
      if(r<0.80) return "soldier";
      return "shield";
    }
    // later
    if(r<0.18) return "scout";
    if(r<0.50) return "soldier";
    if(r<0.78) return "shield";
    return "brute";
  }

  function makeEnemy(w){
    const W = innerWidth;
    const type = chooseTypeForWave(w);
    const T = ENEMY[type];

    const baseHp = 58 + (w-1)*15;
    const hp = Math.round(baseHp * T.hpMul * (0.9 + Math.random()*0.25));

    const baseSpd = 36 + (w-1)*3.2;
    const speed = baseSpd * T.spdMul * (0.85 + Math.random()*0.25);

    return {
      id: NEXT_ID++,
      type,
      x: W + 80 + Math.random()*140,
      y: G.laneY,
      r: T.r,
      hp, hpMax: hp,
      speed,
      dead:false,
      attacking:false,
      atkCd: rand(0.35,0.60),
      atkT: rand(0.05,0.25)
    };
  }

  function makeArcher(towerIndex){
    return { id: NEXT_ID++, towerIndex, alive:true, cooldown:0 };
  }

  function startWave(n){
    G.wave = n;
    UI.wave.textContent = String(n);
    G.enemiesToSpawn = Math.round(7 + (n-1)*2.6);
    G.spawnedThisWave = 0;
    G.nextSpawn = 0.25;
    G.waveClearT = 0;
  }

  function reset(){
    G.t = 0;
    G.wave = 1;
    G.crowns = 0;
    G.enemies.length = 0;
    G.arrows.length = 0;
    G.particles.length = 0;

    for(const t of G.towers) t.hp = 100;

    G.archers = [ makeArcher(0), makeArcher(1), makeArcher(2) ];
    G.towers[0].archers = [G.archers[0]];
    G.towers[1].archers = [G.archers[1]];
    G.towers[2].archers = [G.archers[2]];

    G.volleyActive = false;
    G.volleyHits = [false,false,false];
    G.volleyResolveT = 0;

    UI.crowns.textContent = "0";
    G.aimActive = false;
    startWave(1);
  }

  // ===== Stick Figure Drawing =====
  function drawStickMan(x, groundY, scale, attacking){
    // groundY is foot level
    const headR = 5*scale;
    const body = 14*scale;

    const hx = x;
    const hy = groundY - (headR*2 + body + 8*scale);

    // head
    ctx.strokeStyle = "#1c1c1c";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(hx, hy, headR, 0, Math.PI*2);
    ctx.stroke();

    // body
    const neckY = hy + headR;
    const torsoY = neckY + body;

    ctx.beginPath();
    ctx.moveTo(hx, neckY);
    ctx.lineTo(hx, torsoY);
    ctx.stroke();

    // arms (slight animation)
    const armY = neckY + 5*scale;
    const armOut = 10*scale;
    const armDown = attacking ? 2*scale : 6*scale;

    ctx.beginPath();
    ctx.moveTo(hx, armY);
    ctx.lineTo(hx - armOut, armY + armDown);
    ctx.moveTo(hx, armY);
    ctx.lineTo(hx + armOut, armY + armDown);
    ctx.stroke();

    // legs
    const legOut = 8*scale;
    const legDown = 12*scale;
    ctx.beginPath();
    ctx.moveTo(hx, torsoY);
    ctx.lineTo(hx - legOut, torsoY + legDown);
    ctx.moveTo(hx, torsoY);
    ctx.lineTo(hx + legOut, torsoY + legDown);
    ctx.stroke();
  }

  // ===== Shooting (all three arrows at once) =====
  function spawnArrow(archerIndex, fromX, fromY, aimX, aimY){
    // IMPORTANT: This is "aimed" with gravity. You must aim above for long shots.
    // We'll set initial velocity proportional to aim vector; gravity will drop it.
    const dx = aimX - fromX;
    const dy = aimY - fromY;

    // clamp how low you can aim (so you can't trivially shoot the floor and still hit)
    // still allows aiming near ground, but not below it.
    const minAimY = G.groundY - 6;
    const adjAimY = Math.min(aimY, minAimY);

    const ddx = dx;
    const ddy = adjAimY - fromY;

    // speed scales with distance so far targets still reachable
    const dist = Math.hypot(ddx, ddy) || 1;
    const speed = clamp(420 + dist*0.55, 520, 920);

    const vx = (ddx/dist) * speed;
    const vy = (ddy/dist) * speed;

    G.arrows.push({
      archerIndex,
      x: fromX, y: fromY,
      vx, vy,
      g: 760,
      alive:true,
      trail:[]
    });
  }

  function fireVolley(){
    if(aliveArchers()<=0) return;

    // begin volley (crowns based on how many arrows hit anything)
    G.volleyActive = true;
    G.volleyHits = [false,false,false];
    G.volleyResolveT = 0;

    for(let i=0;i<G.archers.length;i++){
      const a = G.archers[i];
      if(!a.alive) continue;
      if(a.cooldown>0) continue;

      const p = archerPos(a);

      // small per-archer spread so they don’t stack perfectly
      const spread = (i-1) * 10;
      spawnArrow(i, p.x, p.y, G.aimX, G.aimY + spread);

      a.cooldown = 0.55;
    }
  }

  function resolveVolleyIfReady(){
    if(!G.volleyActive) return;

    const arrowsAlive = G.arrows.some(a=>a.alive);
    if(arrowsAlive && G.volleyResolveT < 0.95) return;

    const hits = (G.volleyHits[0]?1:0) + (G.volleyHits[1]?1:0) + (G.volleyHits[2]?1:0);
    if(hits>0){
      G.crowns += hits;
      UI.crowns.textContent = String(G.crowns);
    }
    G.volleyActive = false;
  }

  // ===== Combat / Damage =====
  function damageFrontTower(amount){
    const t = frontAliveTower();
    if(!t) return;
    t.hp = clamp(t.hp - amount, 0, 100);
    if(t.hp<=0){
      for(const a of t.archers) a.alive = false;
    }
  }

  function killEnemy(e){
    e.dead = true;
    for(let i=0;i<10;i++){
      G.particles.push({
        x:e.x, y:e.y-18,
        vx:(Math.random()*2-1)*160,
        vy:(Math.random()*2-1)*160 - 80,
        life:0.6 + Math.random()*0.3
      });
    }
  }

  // ===== Input =====
  function canvasXY(ev){
    const r = canvas.getBoundingClientRect();
    return { x: ev.clientX - r.left, y: ev.clientY - r.top };
  }

  canvas.addEventListener("pointerdown", (ev)=>{
    ev.preventDefault();
    const {x,y} = canvasXY(ev);
    G.aimX = x;
    G.aimY = y;
    G.aimActive = true;
    fireVolley(); // shoot immediately on tap/click
  }, {passive:false});

  UI.restart.addEventListener("click", reset);
  addEventListener("keydown", (e)=>{ if(e.key.toLowerCase()==="r") reset(); });

  // ===== Update =====
  function update(dt){
    layout();

    // UI
    UI.alive.textContent = String(aliveArchers());
    UI.ta.textContent = String(Math.round(G.towers[0].hp));
    UI.tb.textContent = String(Math.round(G.towers[1].hp));
    UI.tc.textContent = String(Math.round(G.towers[2].hp));

    // cooldowns
    for(const a of G.archers) a.cooldown = Math.max(0, a.cooldown - dt);

    // spawn enemies
    if(aliveArchers()>0){
      G.nextSpawn -= dt;
      if(G.spawnedThisWave < G.enemiesToSpawn && G.nextSpawn <= 0){
        G.enemies.push(makeEnemy(G.wave));
        G.spawnedThisWave++;
        const base = 0.75 - Math.min(0.40, (G.wave-1)*0.02);
        G.nextSpawn = base * (0.85 + Math.random()*0.3);
      }
    }

    // enemies move + stop at front of current tower
    const front = frontAliveTower();
    const stopX = front ? (front.x - front.w/2 - 18) : -9999;

    for(const e of G.enemies){
      if(e.dead) continue;
      e.y = G.groundY;

      if(front && e.x <= stopX){
        e.attacking = true;
        e.atkT -= dt;
        if(e.atkT <= 0){
          e.atkT = e.atkCd;
          const T = ENEMY[e.type];
          const dmg = (2.3 + (G.wave-1)*0.11) * (T.dmgMul || 1);
          damageFrontTower(dmg);
        }
      } else {
        e.attacking = false;
        e.x -= e.speed * dt;
      }
    }

    // arrows physics + hits (ground-level enemies)
    for(const ar of G.arrows){
      if(!ar.alive) continue;

      ar.vy += ar.g * dt;
      ar.x += ar.vx * dt;
      ar.y += ar.vy * dt;

      ar.trail.push([ar.x, ar.y]);
      if(ar.trail.length > 10) ar.trail.shift();

      // hit ground -> die (this makes "aim above" necessary)
      if(ar.y >= G.groundY - 2){
        ar.alive = false;
        continue;
      }

      // offscreen
      if(ar.x < -160 || ar.x > innerWidth+220 || ar.y < -220 || ar.y > innerHeight+220){
        ar.alive = false;
        continue;
      }

      // collision with enemies: treat enemy as a circle centered above ground
      for(const e of G.enemies){
        if(e.dead) continue;

        // center about torso area above ground
        const cx = e.x;
        const cy = e.y - 28; // torso-ish height
        const rr = (e.r+6)*(e.r+6);

        if(dist2(ar.x, ar.y, cx, cy) <= rr){
          ar.alive = false;

          // shield block chance
          const T = ENEMY[e.type];
          const blocked = (T.block && Math.random() < T.block);

          if(!blocked){
            // counts for volley crowns
            G.volleyHits[ar.archerIndex] = true;

            const baseDmg = 26 + (G.wave-1)*1.7;
            const dr = (T.dr != null) ? T.dr : 1.0;
            e.hp -= baseDmg * dr;

            for(let i=0;i<6;i++){
              G.particles.push({
                x:cx, y:cy,
                vx:(Math.random()*2-1)*160,
                vy:(Math.random()*2-1)*160 - 50,
                life:0.25 + Math.random()*0.25
              });
            }
            if(e.hp <= 0) killEnemy(e);
          } else {
            // blocked particles
            for(let i=0;i<6;i++){
              G.particles.push({
                x:cx, y:cy,
                vx:(Math.random()*2-1)*120,
                vy:(Math.random()*2-1)*120 - 70,
                life:0.20 + Math.random()*0.18
              });
            }
          }
          break;
        }
      }
    }
    G.arrows = G.arrows.filter(a=>a.alive);

    // particles
    for(const p of G.particles){
      p.life -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 620 * dt;
    }
    G.particles = G.particles.filter(p=>p.life>0);

    // resolve volley
    if(G.volleyActive) G.volleyResolveT += dt;
    resolveVolleyIfReady();

    // wave clear -> next
    const anyAlive = G.enemies.some(e=>!e.dead);
    const allSpawned = (G.spawnedThisWave >= G.enemiesToSpawn);
    if(allSpawned && !anyAlive && aliveArchers()>0){
      G.waveClearT += dt;
      if(G.waveClearT > 1.05) startWave(G.wave+1);
    } else {
      G.waveClearT = 0;
    }
  }

  // ===== Draw =====
  function draw(){
    const W = innerWidth, H = innerHeight;

    // sky
    ctx.fillStyle = "#bfd3ff";
    ctx.fillRect(0,0,W,H);

    // far haze
    ctx.fillStyle = "#93b685";
    ctx.fillRect(0, G.groundY-160, W, 160);

    // ground
    ctx.fillStyle = "#6b8f52";
    ctx.fillRect(0, G.groundY, W, H-G.groundY);

    // ground line
    ctx.strokeStyle = "rgba(0,0,0,.18)";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, G.groundY);
    ctx.lineTo(W, G.groundY);
    ctx.stroke();

    // towers
    for(const t of G.towers){
      const h = towerHeight(t);
      const x = t.x - t.w/2;
      const y = t.baseY - h;

      // body
      ctx.fillStyle = "#5b606a";
      ctx.fillRect(x, y, t.w, h);

      // cap
      ctx.fillStyle = "#4b4f58";
      ctx.fillRect(x-5, y-12, t.w+10, 14);

      // hp bar
      ctx.fillStyle = "rgba(0,0,0,.35)";
      ctx.fillRect(x, y-26, t.w, 8);
      ctx.fillStyle = "#2aff6a";
      ctx.fillRect(x, y-26, t.w*(t.hp/100), 8);

      if(t.hp<=0){
        ctx.fillStyle = "#3c3f46";
        ctx.fillRect(x-12, t.baseY-14, t.w+24, 14);
      }
    }

    // archers
    for(let i=0;i<G.archers.length;i++){
      const a = G.archers[i];
      const p = archerPos(a);

      if(!a.alive){
        ctx.strokeStyle = "rgba(190,40,40,.9)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(p.x-8,p.y-8); ctx.lineTo(p.x+8,p.y+8);
        ctx.moveTo(p.x+8,p.y-8); ctx.lineTo(p.x-8,p.y+8);
        ctx.stroke();
        continue;
      }

      ctx.fillStyle = "#23304a";
      ctx.beginPath();
      ctx.arc(p.x, p.y, 8, 0, Math.PI*2);
      ctx.fill();

      // bow
      ctx.strokeStyle = "#c79a3a";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(p.x+7, p.y, 7, -Math.PI/2, Math.PI/2);
      ctx.stroke();
    }

    // aim indicator (shows "shoot above" behavior)
    ctx.strokeStyle = "rgba(0,0,0,.18)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(G.aimX-10, G.aimY);
    ctx.lineTo(G.aimX+10, G.aimY);
    ctx.moveTo(G.aimX, G.aimY-10);
    ctx.lineTo(G.aimX, G.aimY+10);
    ctx.stroke();

    // enemies (stick figures)
    for(const e of G.enemies){
      if(e.dead) continue;

      // small type badge above head
      const badge = (e.type==="scout")?"S" : (e.type==="soldier")?"M" : (e.type==="shield")?"H" : "B";
      drawStickMan(e.x, e.y, 1.0, e.attacking);

      // hp
      const bw = 40, bh = 5;
      ctx.fillStyle = "rgba(0,0,0,.35)";
      ctx.fillRect(e.x - bw/2, e.y - 68, bw, bh);
      ctx.fillStyle = "#ff3c3c";
      ctx.fillRect(e.x - bw/2, e.y - 68, bw*(e.hp/e.hpMax), bh);

      // badge
      ctx.fillStyle = "rgba(0,0,0,.35)";
      ctx.fillRect(e.x-8, e.y-88, 16, 16);
      ctx.fillStyle = "#fff";
      ctx.font = "800 11px system-ui,-apple-system,Segoe UI,Roboto";
      ctx.textAlign = "center";
      ctx.fillText(badge, e.x, e.y-76);
      ctx.textAlign = "left";
    }

    // arrows
    for(const a of G.arrows){
      // trail
      ctx.strokeStyle = "rgba(0,0,0,.20)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      for(let i=0;i<a.trail.length;i++){
        const [tx,ty] = a.trail[i];
        if(i===0) ctx.moveTo(tx,ty); else ctx.lineTo(tx,ty);
      }
      ctx.stroke();

      // shaft (angle-ish)
      ctx.strokeStyle = "#3a2a14";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(a.x - a.vx*0.02, a.y - a.vy*0.02);
      ctx.stroke();

      // tip
      ctx.fillStyle = "#c0c6d3";
      ctx.beginPath();
      ctx.arc(a.x, a.y, 2.4, 0, Math.PI*2);
      ctx.fill();
    }

    // particles
    for(const p of G.particles){
      ctx.globalAlpha = clamp(p.life,0,1);
      ctx.fillStyle = "rgba(255,255,255,.85)";
      ctx.fillRect(p.x, p.y, 2, 2);
    }
    ctx.globalAlpha = 1;

    // wave cleared
    if(G.waveClearT>0.05 && aliveArchers()>0){
      ctx.fillStyle = "rgba(0,0,0,.22)";
      ctx.fillRect(W/2-120, 14, 240, 36);
      ctx.fillStyle = "#fff";
      ctx.font = "900 16px system-ui,-apple-system,Segoe UI,Roboto";
      ctx.textAlign = "center";
      ctx.fillText("Wave cleared!", W/2, 37);
      ctx.textAlign = "left";
    }

    // game over
    if(aliveArchers()<=0){
      ctx.fillStyle = "rgba(0,0,0,.48)";
      ctx.fillRect(0,0,W,H);
      ctx.fillStyle = "#fff";
      ctx.font = "900 36px system-ui,-apple-system,Segoe UI,Roboto";
      ctx.textAlign = "center";
      ctx.fillText("GAME OVER", W/2, H*0.44);
      ctx.font = "800 18px system-ui,-apple-system,Segoe UI,Roboto";
      ctx.fillText(`Crowns: ${G.crowns}`, W/2, H*0.44 + 34);
      ctx.font = "700 14px system-ui,-apple-system,Segoe UI,Roboto";
      ctx.fillText("Tap Restart to play again.", W/2, H*0.44 + 58);
      ctx.textAlign = "left";
    }
  }

  // ===== Main Loop =====
  let last = performance.now();
  function frame(now){
    const dt = Math.min(0.033, (now-last)/1000);
    last = now;
    G.t += dt;

    update(dt);
    draw();

    requestAnimationFrame(frame);
  }

  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
