<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Oz Tower Attack </title>
<style>
  html,body{margin:0;height:100%;background:#0f1116;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,Roboto}
  canvas{display:block;width:100vw;height:100vh;touch-action:manipulation}
  .hud{
    position:fixed;left:10px;top:10px;z-index:5;color:#e8ecff;
    background:rgba(0,0,0,.35);padding:10px 12px;border-radius:10px;
    backdrop-filter: blur(6px);
    font-size:14px;line-height:1.35;min-width:260px
  }
  .hint{opacity:.85;font-size:12px;margin-top:6px}
  .btn{
    margin-top:8px;display:inline-block;background:#2a63ff;color:#fff;
    padding:6px 10px;border-radius:9px;font-weight:800;font-size:13px;
    user-select:none
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div><b>Wave:</b> <span id="wave">1</span></div>
  <div><b>Crowns:</b> <span id="crowns">0</span></div>
  <div><b>Archers Alive:</b> <span id="alive">3</span>/3</div>
  <div><b>Towers:</b> A <span id="ta">100</span>% &nbsp; B <span id="tb">100</span>% &nbsp; C <span id="tc">100</span>%</div>
  <div class="hint">
    Tap/click an enemy (optional) then it fires a 3-arrow volley.<br/>
    Crowns per volley = number of arrows that hit <i>any</i> enemy (1/2/3).
  </div>
  <div class="btn" id="restart">Restart</div>
</div>

<script>
(() => {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d", { alpha:false });

  const UI = {
    wave: document.getElementById("wave"),
    crowns: document.getElementById("crowns"),
    alive: document.getElementById("alive"),
    ta: document.getElementById("ta"),
    tb: document.getElementById("tb"),
    tc: document.getElementById("tc"),
    restart: document.getElementById("restart")
  };

  // ===== Helpers =====
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const dist2=(ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;};
  const rand=(a,b)=>a+Math.random()*(b-a);

  function resize(){
    const dpr = Math.max(1, Math.min(2, window.devicePixelRatio||1));
    canvas.width = Math.floor(innerWidth*dpr);
    canvas.height = Math.floor(innerHeight*dpr);
    canvas.style.width = innerWidth+"px";
    canvas.style.height = innerHeight+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  addEventListener("resize", resize, {passive:true});
  resize();

  // ===== Enemy Types =====
  // block = chance to block an arrow entirely
  // dr = damage multiplier (shield reduces damage when not blocked, too)
  const ENEMY = {
    scout:  { name:"Scout",  hpMul:0.65, spdMul:1.45, dmgMul:0.85, r:12, block:0.00, dr:1.00, hue:"#9ad1ff" },
    soldier:{ name:"Soldier",hpMul:1.00, spdMul:1.00, dmgMul:1.00, r:14, block:0.00, dr:1.00, hue:"#b8c3d8" },
    shield: { name:"Shield", hpMul:1.15, spdMul:0.90, dmgMul:1.05, r:15, block:0.35, dr:0.65, hue:"#d8d0a8" },
    brute:  { name:"Brute",  hpMul:1.85, spdMul:0.70, dmgMul:1.25, r:16, block:0.00, dr:1.00, hue:"#c6a0ff" }
  };

  // ===== Game State =====
  let NEXT_ID = 1;

  const G = {
    t: 0,
    wave: 1,
    crowns: 0,

    enemies: [],
    arrows: [],
    particles: [],

    // If you click an enemy, we prefer targeting that one (per archer picks closest in lane if not)
    preferredTargetId: null,

    // volley bookkeeping (crowns per volley)
    volleyActive: false,
    volleyHits: [false,false,false],   // did arrow 0/1/2 hit any enemy
    volleyResolveTimer: 0,

    // wave spawning
    enemiesToSpawn: 0,
    spawnedThisWave: 0,
    nextSpawn: 0,
    waveClearTimer: 0,

    // layout
    groundY: 0,
    lanesY: [0,0,0],

    towers: [
      { id:"A", hp:100, maxH:240, w:64, x:0, baseY:0, archers:[] },
      { id:"B", hp:100, maxH:220, w:64, x:0, baseY:0, archers:[] },
      { id:"C", hp:100, maxH:205, w:64, x:0, baseY:0, archers:[] }
    ],
    archers: [] // 3 total, one on each tower
  };

  function layout(){
    const W = innerWidth, H = innerHeight;
    G.groundY = Math.floor(H*0.80);

    // 3 lanes (archer i shoots mostly toward lane i)
    G.lanesY[0] = Math.floor(G.groundY - H*0.25);
    G.lanesY[1] = Math.floor(G.groundY - H*0.17);
    G.lanesY[2] = Math.floor(G.groundY - H*0.10);

    // towers left
    G.towers[0].x = Math.floor(W*0.16);
    G.towers[1].x = Math.floor(W*0.24);
    G.towers[2].x = Math.floor(W*0.32);
    for(const t of G.towers){
      t.baseY = G.groundY;
      t.w = Math.max(56, Math.floor(W*0.05));
    }
  }

  function towerHeight(t){
    return Math.max(0, t.maxH * (t.hp/100));
  }

  function archerPos(a){
    const t = G.towers[a.towerIndex];
    const h = towerHeight(t);
    return { x: t.x, y: (t.baseY - h) - 10 };
  }

  function aliveArchers(){
    return G.archers.reduce((n,a)=>n+(a.alive?1:0),0);
  }

  function getEnemy(id){
    return G.enemies.find(e=>e.id===id) || null;
  }

  function chooseTypeForWave(wave){
    const r = Math.random();
    if(wave < 3){
      return (r<0.25) ? "scout" : "soldier";
    } else if(wave < 6){
      if(r<0.22) return "scout";
      if(r<0.80) return "soldier";
      return "shield";
    } else {
      if(r<0.18) return "scout";
      if(r<0.50) return "soldier";
      if(r<0.78) return "shield";
      return "brute";
    }
  }

  function makeEnemy(wave){
    const W = innerWidth;
    const lane = Math.floor(Math.random()*3);
    const type = chooseTypeForWave(wave);
    const T = ENEMY[type];

    const baseHp = 54 + (wave-1)*14;
    const hp = Math.round(baseHp * T.hpMul * (0.9 + Math.random()*0.25));

    const baseSpd = 32 + (wave-1)*3;
    const speed = baseSpd * T.spdMul * (0.85 + Math.random()*0.25);

    return {
      id: NEXT_ID++,
      lane,
      type,
      x: W + 70 + Math.random()*140,
      y: 0,
      r: T.r,
      hp, hpMax: hp,
      speed,
      attacking:false,
      atkCd: rand(0.35,0.60),
      atkT: rand(0.05,0.25),
      dead:false
    };
  }

  function nearestEnemyInLane(lane){
    let best=null, bestX=1e18;
    for(const e of G.enemies){
      if(e.dead || e.lane!==lane) continue;
      if(e.x < bestX){ bestX = e.x; best = e; }
    }
    return best;
  }

  function makeArcher(towerIndex, laneIndex){
    return { id: NEXT_ID++, towerIndex, laneIndex, alive:true, cooldown:0 };
  }

  function startWave(n){
    G.wave = n;
    UI.wave.textContent = String(n);

    G.enemiesToSpawn = Math.round(7 + (n-1)*2.4);
    G.spawnedThisWave = 0;
    G.nextSpawn = 0.3;
    G.waveClearTimer = 0;
  }

  function reset(){
    G.t = 0;
    G.wave = 1;
    G.crowns = 0;
    G.enemies.length = 0;
    G.arrows.length = 0;
    G.particles.length = 0;
    G.preferredTargetId = null;

    for(const t of G.towers) t.hp = 100;

    G.archers = [
      makeArcher(0,0),
      makeArcher(1,1),
      makeArcher(2,2)
    ];
    G.towers[0].archers = [G.archers[0]];
    G.towers[1].archers = [G.archers[1]];
    G.towers[2].archers = [G.archers[2]];

    G.volleyActive = false;
    G.volleyHits = [false,false,false];
    G.volleyResolveTimer = 0;

    UI.crowns.textContent = "0";
    startWave(1);
  }

  // ===== Shooting / Volley =====
  function spawnArrow(archerIndex, from, target){
    const dx = target.x - from.x;
    const dy = target.y - from.y;
    const len = Math.hypot(dx,dy) || 1;

    const speed = 560;
    const vx = (dx/len)*speed;
    const vy = (dy/len)*speed - 180;

    G.arrows.push({
      archerIndex,
      x: from.x,
      y: from.y,
      vx, vy,
      g: 560,
      alive:true,
      targetId: target.id,
      trail:[]
    });
  }

  function fireVolley(){
    if(aliveArchers()<=0) return;

    // start a new volley
    G.volleyActive = true;
    G.volleyHits = [false,false,false];
    G.volleyResolveTimer = 0;

    for(let i=0;i<G.archers.length;i++){
      const a = G.archers[i];
      if(!a.alive) continue;
      if(a.cooldown>0) continue;

      // Each archer prefers:
      // 1) clicked target if alive
      // 2) nearest enemy in their lane
      let target = null;
      const pref = G.preferredTargetId ? getEnemy(G.preferredTargetId) : null;
      if(pref && !pref.dead) target = pref;
      if(!target) target = nearestEnemyInLane(a.laneIndex);

      if(target){
        spawnArrow(i, archerPos(a), target);
        a.cooldown = 0.55;
      }
    }
  }

  function resolveVolleyIfReady(){
    if(!G.volleyActive) return;
    const arrowsAlive = G.arrows.some(a=>a.alive);
    if(arrowsAlive && G.volleyResolveTimer < 0.85) return;

    const hits = (G.volleyHits[0]?1:0) + (G.volleyHits[1]?1:0) + (G.volleyHits[2]?1:0);
    if(hits>0){
      G.crowns += hits; // 1/2/3 crowns based on number of arrows that hit any enemy
      UI.crowns.textContent = String(G.crowns);
    }
    G.volleyActive = false;
  }

  function killEnemy(e){
    e.dead = true;
    if(G.preferredTargetId === e.id) G.preferredTargetId = null;
    for(let i=0;i<14;i++){
      G.particles.push({
        x:e.x, y:e.y,
        vx:(Math.random()*2-1)*150,
        vy:(Math.random()*2-1)*150 - 70,
        life:0.7 + Math.random()*0.4
      });
    }
  }

  // ===== Tower Damage =====
  function damageTower(amount){
    // Enemies hit the front-most (smallest x) still standing tower.
    const alive = G.towers.filter(t=>t.hp>0);
    if(alive.length===0) return;

    let front = alive[0];
    for(const t of alive) if(t.x < front.x) front = t;

    front.hp = clamp(front.hp - amount, 0, 100);
    if(front.hp<=0){
      for(const a of front.archers) a.alive = false;
    }
  }

  // ===== Input =====
  function canvasXY(ev){
    const r = canvas.getBoundingClientRect();
    return { x: ev.clientX - r.left, y: ev.clientY - r.top };
  }

  function pickEnemyAt(x,y){
    let best=null, bestD=1e18;
    for(const e of G.enemies){
      if(e.dead) continue;
      const d = dist2(x,y,e.x,e.y);
      const rr = (e.r+10)*(e.r+10);
      if(d<=rr && d<bestD){ bestD=d; best=e; }
    }
    return best;
  }

  canvas.addEventListener("pointerdown", (ev)=>{
    ev.preventDefault();
    const {x,y} = canvasXY(ev);
    const e = pickEnemyAt(x,y);
    if(e) G.preferredTargetId = e.id; // optional selection
    fireVolley();
  }, {passive:false});

  UI.restart.addEventListener("click", reset);
  addEventListener("keydown", (e)=>{ if(e.key.toLowerCase()==="r") reset(); });

  // ===== Update =====
  function update(dt){
    layout();

    // UI
    UI.alive.textContent = String(aliveArchers());
    UI.ta.textContent = String(Math.round(G.towers[0].hp));
    UI.tb.textContent = String(Math.round(G.towers[1].hp));
    UI.tc.textContent = String(Math.round(G.towers[2].hp));

    // cooldowns
    for(const a of G.archers) a.cooldown = Math.max(0, a.cooldown - dt);

    // spawn enemies
    if(aliveArchers()>0){
      G.nextSpawn -= dt;
      if(G.spawnedThisWave < G.enemiesToSpawn && G.nextSpawn<=0){
        G.enemies.push(makeEnemy(G.wave));
        G.spawnedThisWave++;
        const base = 0.72 - Math.min(0.38, (G.wave-1)*0.022);
        G.nextSpawn = base * (0.85 + Math.random()*0.3);
      }
    }

    // enemy movement/attack
    const frontX = Math.min(G.towers[0].x, G.towers[1].x, G.towers[2].x) - 25;

    for(const e of G.enemies){
      if(e.dead) continue;
      e.y = G.lanesY[e.lane];

      if(e.x <= frontX){
        e.attacking = true;
        e.atkT -= dt;
        if(e.atkT <= 0){
          e.atkT = e.atkCd;
          const T = ENEMY[e.type];
          const dmg = (2.1 + (G.wave-1)*0.10) * T.dmgMul;
          damageTower(dmg);
        }
      } else {
        e.attacking = false;
        e.x -= e.speed * dt;
      }
    }

    // arrows
    for(const ar of G.arrows){
      if(!ar.alive) continue;
      ar.vy += ar.g * dt;
      ar.x += ar.vx * dt;
      ar.y += ar.vy * dt;

      ar.trail.push([ar.x, ar.y]);
      if(ar.trail.length>10) ar.trail.shift();

      if(ar.x < -140 || ar.x > innerWidth+180 || ar.y > innerHeight+160 || ar.y < -180){
        ar.alive = false;
        continue;
      }

      const target = getEnemy(ar.targetId);
      if(target && !target.dead){
        const rr = (target.r+6)*(target.r+6);
        if(dist2(ar.x, ar.y, target.x, target.y) <= rr){
          ar.alive = false;

          const T = ENEMY[target.type];
          const blocked = (T.block>0 && Math.random() < T.block);

          if(!blocked){
            // counts as a hit for volley crowns
            G.volleyHits[ar.archerIndex] = true;

            const baseDmg = 24 + (G.wave-1)*1.6;
            const dmg = baseDmg * (T.dr || 1);
            target.hp -= dmg;

            for(let i=0;i<6;i++){
              G.particles.push({
                x:target.x, y:target.y,
                vx:(Math.random()*2-1)*160,
                vy:(Math.random()*2-1)*160,
                life:0.25 + Math.random()*0.25
              });
            }
            if(target.hp<=0) killEnemy(target);
          } else {
            // blocked -> no "hit" for volley
            for(let i=0;i<5;i++){
              G.particles.push({
                x:target.x, y:target.y-6,
                vx:(Math.random()*2-1)*120,
                vy:(Math.random()*2-1)*120 - 60,
                life:0.22 + Math.random()*0.15
              });
            }
          }
        }
      }
    }
    G.arrows = G.arrows.filter(a=>a.alive);

    // particles
    for(const p of G.particles){
      p.life -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 520 * dt;
    }
    G.particles = G.particles.filter(p=>p.life>0);

    // resolve volley
    if(G.volleyActive) G.volleyResolveTimer += dt;
    resolveVolleyIfReady();

    // wave clear -> next wave
    const anyAlive = G.enemies.some(e=>!e.dead);
    const allSpawned = (G.spawnedThisWave >= G.enemiesToSpawn);
    if(allSpawned && !anyAlive && aliveArchers()>0){
      G.waveClearTimer += dt;
      if(G.waveClearTimer > 1.05){
        startWave(G.wave+1);
      }
    } else {
      G.waveClearTimer = 0;
    }
  }

  // ===== Draw =====
  function draw(){
    const W = innerWidth, H = innerHeight;
    const groundY = G.groundY;

    // sky
    ctx.fillStyle = "#bfd3ff";
    ctx.fillRect(0,0,W,H);

    // background strip
    ctx.fillStyle = "#8fb07d";
    ctx.fillRect(0, groundY-150, W, 150);

    // ground
    ctx.fillStyle = "#6b8f52";
    ctx.fillRect(0, groundY, W, H-groundY);

    // lane markers
    for(let i=0;i<3;i++){
      const y = G.lanesY[i];
      ctx.strokeStyle = "rgba(0,0,0,.10)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, y+24);
      ctx.lineTo(W, y+24);
      ctx.stroke();
    }

    // towers
    for(const t of G.towers){
      const h = towerHeight(t);
      const x = t.x - t.w/2;
      const y = t.baseY - h;

      ctx.fillStyle = "#5b606a";
      ctx.fillRect(x, y, t.w, h);

      ctx.fillStyle = "#4b4f58";
      ctx.fillRect(x-5, y-12, t.w+10, 14);

      // hp bar
      ctx.fillStyle = "rgba(0,0,0,.35)";
      ctx.fillRect(x, y-26, t.w, 8);
      ctx.fillStyle = "#2aff6a";
      ctx.fillRect(x, y-26, t.w*(t.hp/100), 8);

      if(t.hp<=0){
        ctx.fillStyle = "#3c3f46";
        ctx.fillRect(x-12, t.baseY-14, t.w+24, 14);
      }
    }

    // archers
    for(let i=0;i<G.archers.length;i++){
      const a = G.archers[i];
      const p = archerPos(a);

      if(!a.alive){
        ctx.strokeStyle = "rgba(190,40,40,.9)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(p.x-8,p.y-8); ctx.lineTo(p.x+8,p.y+8);
        ctx.moveTo(p.x+8,p.y-8); ctx.lineTo(p.x-8,p.y+8);
        ctx.stroke();
        continue;
      }

      ctx.fillStyle = "#23304a";
      ctx.beginPath();
      ctx.arc(p.x, p.y, 8, 0, Math.PI*2);
      ctx.fill();

      ctx.strokeStyle = "#c79a3a";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(p.x+7, p.y, 7, -Math.PI/2, Math.PI/2);
      ctx.stroke();

      // lane label
      ctx.fillStyle = "rgba(0,0,0,.35)";
      ctx.fillRect(p.x-14, p.y-26, 28, 14);
      ctx.fillStyle = "#fff";
      ctx.font = "800 11px system-ui,-apple-system,Segoe UI,Roboto";
      ctx.textAlign = "center";
      ctx.fillText(["TOP","MID","BOT"][a.laneIndex], p.x, p.y-15);
      ctx.textAlign = "left";
    }

    // enemies
    for(const e of G.enemies){
      if(e.dead) continue;
      const T = ENEMY[e.type];

      ctx.fillStyle = "#2c2c2c";
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r, 0, Math.PI*2);
      ctx.fill();

      ctx.fillStyle = T.hue;
      ctx.beginPath();
      ctx.arc(e.x-3, e.y-5, e.r*0.55, 0, Math.PI*2);
      ctx.fill();

      if(e.type==="shield"){
        ctx.fillStyle = "rgba(40,30,10,.6)";
        ctx.fillRect(e.x+8, e.y-6, 8, 12);
      }

      // hp bar
      const bw=36, bh=5;
      ctx.fillStyle = "rgba(0,0,0,.35)";
      ctx.fillRect(e.x-bw/2, e.y-e.r-14, bw, bh);
      ctx.fillStyle = "#ff3c3c";
      ctx.fillRect(e.x-bw/2, e.y-e.r-14, bw*(e.hp/e.hpMax), bh);

      // preferred target ring
      if(G.preferredTargetId === e.id){
        ctx.strokeStyle = "rgba(255,210,74,.9)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.r+10, 0, Math.PI*2);
        ctx.stroke();
      }

      if(e.attacking){
        ctx.fillStyle = "rgba(200,40,40,.85)";
        ctx.fillRect(e.x-6, e.y+e.r+6, 12, 4);
      }
    }

    // arrows
    for(const a of G.arrows){
      ctx.strokeStyle = "rgba(0,0,0,.20)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      for(let i=0;i<a.trail.length;i++){
        const [tx,ty] = a.trail[i];
        if(i===0) ctx.moveTo(tx,ty); else ctx.lineTo(tx,ty);
      }
      ctx.stroke();

      ctx.strokeStyle = "#3a2a14";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(a.x - a.vx*0.02, a.y - a.vy*0.02);
      ctx.stroke();

      ctx.fillStyle = "#c0c6d3";
      ctx.beginPath();
      ctx.arc(a.x, a.y, 2.4, 0, Math.PI*2);
      ctx.fill();
    }

    // particles
    for(const p of G.particles){
      ctx.globalAlpha = clamp(p.life,0,1);
      ctx.fillStyle = "rgba(255,255,255,.85)";
      ctx.fillRect(p.x, p.y, 2, 2);
    }
    ctx.globalAlpha = 1;

    // wave cleared banner
    if(G.waveClearTimer>0.05 && aliveArchers()>0){
      ctx.fillStyle = "rgba(0,0,0,.22)";
      ctx.fillRect(W/2-120, 14, 240, 36);
      ctx.fillStyle = "#fff";
      ctx.font = "900 16px system-ui,-apple-system,Segoe UI,Roboto";
      ctx.textAlign = "center";
      ctx.fillText("Wave cleared!", W/2, 37);
      ctx.textAlign = "left";
    }

    // game over overlay
    if(aliveArchers()<=0){
      ctx.fillStyle = "rgba(0,0,0,.48)";
      ctx.fillRect(0,0,W,H);
      ctx.fillStyle = "#fff";
      ctx.font = "900 36px system-ui,-apple-system,Segoe UI,Roboto";
      ctx.textAlign = "center";
      ctx.fillText("GAME OVER", W/2, H*0.44);
      ctx.font = "800 18px system-ui,-apple-system,Segoe UI,Roboto";
      ctx.fillText(`Crowns: ${G.crowns}`, W/2, H*0.44 + 34);
      ctx.font = "700 14px system-ui,-apple-system,Segoe UI,Roboto";
      ctx.fillText("Tap Restart to play again.", W/2, H*0.44 + 58);
      ctx.textAlign = "left";
    }
  }

  // ===== Main Loop =====
  let last = performance.now();
  function frame(now){
    const dt = Math.min(0.033, (now-last)/1000);
    last = now;
    G.t += dt;

    update(dt);
    draw();

    requestAnimationFrame(frame);
  }

  UI.restart.addEventListener("click", reset);

  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
